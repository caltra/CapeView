services:
  postgres:
    image: postgres:16
    container_name: capeview-postgres
    environment:
      POSTGRES_DB: capeview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capeview"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: